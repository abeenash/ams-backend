spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ams
    username: ams_user
    password: ams_password
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-temporary-dev-secret-change-it-before-any-real-deployment}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

